name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Baselines (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: linux-x64
            runner: ubuntu-latest
            snapshot_variant: x64
          - variant: ubuntu24-x64
            runner: ubuntu-24.04
            snapshot_variant: ubuntu24-x64
          - variant: ubuntu24-arm64
            runner: ubuntu-24.04-arm
            snapshot_variant: ubuntu24-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up npm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          npm install --global npm@12.0.2
          echo "${NPM_CONFIG_PREFIX}/bin" >> "$GITHUB_PATH"
          "${NPM_CONFIG_PREFIX}/bin/npm" --version
      - name: Install dependencies
        run: npm ci
      - name: Install browser dependencies
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Regenerate baselines
        env:
          SNUI_SNAPSHOT_VARIANT: ${{ matrix.snapshot_variant }}
          SNUI_UPDATE_BASELINES: "true"
        run: npm run test:browser:update
      - name: Upload baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baselines-${{ matrix.variant }}
          path: tests/browser/panel.spec.ts-snapshots/
          retention-days: 3
          if-no-files-found: error
