name: CI

# Node and npm pin policy for every workflow in this repository:
#
# - Jobs that prove a supported floor pin the exact patch version: the validate
#   matrix pins the Node 22 and Node 24 floors from devEngines.runtime and the
#   Windows and macOS package jobs pin the Node 24 floor. Node 26 floats until
#   it has an LTS release to pin.
# - Jobs that only need a supported Node (browser tests, the full audit, the
#   publish path, the host-contract drift check, and the baseline refresh)
#   float on the active LTS line, `24`, so they track security releases without
#   a manual bump. Those jobs never define the floor.
# - npm is never a literal in a workflow. Each "Set up npm" step installs the
#   newest npm that satisfies devEngines.packageManager.version in
#   package.json, so that field is the one place the supported npm range lives
#   and a new npm 12.x is exercised here before a contributor meets it.
# - The third-party tools this repository downloads instead of running as
#   actions (actionlint, zizmor, and lychee) are pinned in
#   .github/pinned-tools.json, because no dependency updater can see a version
#   written into a run step. Bump a version and its checksum there, in one
#   place, and every workflow that installs the tool follows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A push to main shares one group key per branch, and the release gate needs
  # the run at the release commit to finish: a later merge must not cancel it.
  # Superseded pull-request runs carry no such claim, so those still cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          version="$(jq -er '.actionlint.version' .github/pinned-tools.json)"
          checksum="$(jq -er '.actionlint.sha256' .github/pinned-tools.json)"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$url"
          echo "${checksum}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" actionlint
      - name: Validate workflows
        run: ./actionlint -color
      - name: Install zizmor
        run: |
          version="$(jq -er '.zizmor.version' .github/pinned-tools.json)"
          checksum="$(jq -er '.zizmor.sha256' .github/pinned-tools.json)"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/zizmorcore/zizmor/releases/download/v${version}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$url"
          echo "${checksum}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" zizmor
      - name: Audit workflow security
        run: ./zizmor --min-severity medium --offline .

  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two pinned entries are the devEngines.runtime floors; a unit test
        # keeps this list, scripts/lib/release-checks.mjs, and package.json in
        # step. Branch protection names these jobs, so changing an entry means
        # updating the required checks in the same pull request.
        node: [22.22.2, 24.15.0, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Set up npm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          npm install --global "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
          echo "${NPM_CONFIG_PREFIX}/bin" >> "$GITHUB_PATH"
          "${NPM_CONFIG_PREFIX}/bin/npm" --version
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.node }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ matrix.node }}-
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci
      - name: Validate package
        run: npm run validate

  audit:
    # The full-tree audit covers development tooling whose advisories carry no
    # runtime exposure for consumers, so it reports without blocking: this job
    # is not a required check for main. The runtime audit inside
    # `npm run validate` is the blocking one. See "Release checks" in
    # docs/release-policy.md.
    name: Full dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Floating on the active LTS line; see the pin policy above.
          node-version: 24
          package-manager-cache: false
      - name: Set up npm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          npm install --global "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
          echo "${NPM_CONFIG_PREFIX}/bin" >> "$GITHUB_PATH"
          "${NPM_CONFIG_PREFIX}/bin/npm" --version
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-24-
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci
      - name: Audit the full dependency tree
        run: npm run audit

  windows-package:
    name: Windows package validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned to the Node 24 floor from devEngines.runtime.
          node-version: 24.15.0
          package-manager-cache: false
      - name: Set up npm
        shell: pwsh
        run: |
          $npmPrefix = Join-Path $env:RUNNER_TEMP "npm-global"
          $npmRange = node -p "require('./package.json').devEngines.packageManager.version"
          npm install --global "npm@$npmRange" --prefix $npmPrefix
          $npmPrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $npmPrefix "npm.cmd") --version
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: windows-npm-24.15.0-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            windows-npm-24.15.0-
            windows-npm-
      - name: Install dependencies
        run: npm ci
      - name: Validate package
        run: npm run test:package

  macos-package:
    # The package scripts shell out to tar and create symlinks, and macOS is
    # the third platform contributors build this package on. The job reports
    # without blocking: it is not a required check for main, so a macOS-only
    # break is visible here rather than found alone on a laptop.
    name: macOS package validation
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned to the Node 24 floor from devEngines.runtime.
          node-version: 24.15.0
          package-manager-cache: false
      - name: Set up npm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          npm install --global "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
          echo "${NPM_CONFIG_PREFIX}/bin" >> "$GITHUB_PATH"
          "${NPM_CONFIG_PREFIX}/bin/npm" --version
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: macos-npm-24.15.0-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            macos-npm-24.15.0-
            macos-npm-
      - name: Install dependencies
        run: npm ci
      - name: Validate package
        run: npm run test:package

  browser:
    name: Browser tests (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # These snapshot_variant values are the hosted baseline families. The
        # refresh workflow generates the same two, and a unit test keeps the
        # two lists equal.
        include:
          - architecture: x64
            runner: ubuntu-24.04
            snapshot_variant: ubuntu24-x64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            snapshot_variant: ubuntu24-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Floating on the active LTS line; see the pin policy above.
          node-version: 24
          package-manager-cache: false
      - name: Set up npm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          npm install --global "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
          echo "${NPM_CONFIG_PREFIX}/bin" >> "$GITHUB_PATH"
          "${NPM_CONFIG_PREFIX}/bin/npm" --version
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ matrix.architecture }}-npm-24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.architecture }}-npm-24-
            ${{ runner.os }}-${{ matrix.architecture }}-npm-
      - name: Install dependencies
        run: npm ci
      - name: Install browser dependencies
        # `--with-deps` runs apt, and the runner image configures Google's
        # Chrome repository, which Playwright does not need: it ships its own
        # browser builds and takes only shared libraries from Ubuntu's archive.
        # That third-party index has served a corrupt Packages.gz for long
        # enough to block a release, so drop it before apt reads it.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        env:
          SNUI_SNAPSHOT_VARIANT: ${{ matrix.snapshot_variant }}
        run: npm run test:browser
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.architecture }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error
