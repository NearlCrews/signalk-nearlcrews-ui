name: Publish npm package

on:
  release:
    types: [published]

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  # The release policy allows only one published GitHub Release while this
  # queue has active or pending work, so GitHub cannot replace a pending run.
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      dist-tag: ${{ steps.package.outputs.dist-tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Floating on the active LTS line; see the pin policy in ci.yml.
          node-version: 24
          package-manager-cache: false
      - name: Set up npm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          npm install --global "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
          echo "${NPM_CONFIG_PREFIX}/bin" >> "$GITHUB_PATH"
          "${NPM_CONFIG_PREFIX}/bin/npm" --version
      - name: Verify release metadata
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag ($RELEASE_TAG) must exactly match $EXPECTED_TAG." >&2
            exit 1
          fi
          TAG_OBJECT_TYPE="$(git cat-file -t "$RELEASE_TAG")"
          if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
            echo "Release tag $RELEASE_TAG must be an annotated tag, received object type $TAG_OBJECT_TYPE." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Release tag $RELEASE_TAG resolves to $TAG_COMMIT, not release commit $GITHUB_SHA." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not an ancestor of origin/main." >&2
            exit 1
          fi
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm." >&2
            exit 1
          fi
          LATEST_VERSION="$(npm view "$PACKAGE_NAME" dist-tags.latest)"
          DIST_TAG="$(node scripts/check-registry-order.mjs --candidate "$PACKAGE_VERSION" --latest "$LATEST_VERSION")"
          echo "dist-tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
      - name: Verify exact-commit CI and CodeQL checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/check-release-ci.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install browser dependencies
        # `--with-deps` runs apt, and the runner image configures Google's
        # Chrome repository, which Playwright does not need: it ships its own
        # browser builds and takes only shared libraries from Ubuntu's archive.
        # That third-party index has served a corrupt Packages.gz for long
        # enough to block a release, so drop it before apt reads it.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run release checks
        env:
          SNUI_RELEASE_APPROVED: "true"
          SNUI_SNAPSHOT_VARIANT: ubuntu24-x64
        run: npm run release:check
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-release
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Pack verified package
        run: |
          mkdir package
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("package.json", "utf8"));
          manifest.gitHead = process.env.GITHUB_SHA;
          await writeFile("package.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          TARBALL_NAME="$(npm pack --ignore-scripts --pack-destination package)"
          TARBALL="package/${TARBALL_NAME}"
          PACKED_GIT_HEAD="$(tar --extract --gzip --to-stdout --file "$TARBALL" package/package.json | node -e 'let input=""; process.stdin.on("data", chunk => { input += chunk; }); process.stdin.on("end", () => console.log(JSON.parse(input).gitHead ?? ""));')"
          if [ "$PACKED_GIT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Packed gitHead ($PACKED_GIT_HEAD) must exactly match $GITHUB_SHA." >&2
            exit 1
          fi
          sha256sum "$TARBALL"
      - name: Preserve verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # The publish job installs nothing and publishes only the tarball the
      # verify job preserved. The sparse checkout brings in the release scripts
      # (and, as cone mode always does, the root files such as package.json) so
      # the registry-ordering check runs the same tested code as verification.
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Floating on the active LTS line; see the pin policy in ci.yml.
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Set up npm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          npm install --global "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
          echo "${NPM_CONFIG_PREFIX}/bin" >> "$GITHUB_PATH"
          "${NPM_CONFIG_PREFIX}/bin/npm" --version
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package
      - name: Verify publish candidate
        id: package
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          EXPECTED_GIT_HEAD: ${{ github.sha }}
        run: |
          shopt -s nullglob
          TARBALLS=(package/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one verified tarball, found ${#TARBALLS[@]}." >&2
            exit 1
          fi
          TARBALL="$(realpath -- "${TARBALLS[0]}")"
          if [[ "$TARBALL" != /* ]]; then
            echo "Publish candidate must resolve to an absolute path, received $TARBALL." >&2
            exit 1
          fi
          PACKED_MANIFEST="$(tar --extract --gzip --to-stdout --file "$TARBALL" package/package.json)"
          PACKAGE_NAME="$(node -e 'const manifest = JSON.parse(process.argv[1]); console.log(manifest.name);' "$PACKED_MANIFEST")"
          PACKAGE_VERSION="$(node -e 'const manifest = JSON.parse(process.argv[1]); console.log(manifest.version);' "$PACKED_MANIFEST")"
          PACKED_GIT_HEAD="$(node -e 'const manifest = JSON.parse(process.argv[1]); console.log(manifest.gitHead ?? "");' "$PACKED_MANIFEST")"
          if [ "$PACKED_GIT_HEAD" != "$EXPECTED_GIT_HEAD" ]; then
            echo "Packed gitHead ($PACKED_GIT_HEAD) must exactly match $EXPECTED_GIT_HEAD." >&2
            exit 1
          fi
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm." >&2
            exit 1
          fi
          # The registry may have moved between verification and environment
          # approval, so the ordering check runs again against the live latest.
          LATEST_VERSION="$(npm view "$PACKAGE_NAME" dist-tags.latest)"
          RESOLVED_TAG="$(node scripts/check-registry-order.mjs --candidate "$PACKAGE_VERSION" --latest "$LATEST_VERSION")"
          if [ "$RESOLVED_TAG" != "$DIST_TAG" ]; then
            echo "Registry ordering changed since verification: verified dist-tag $DIST_TAG, now $RESOLVED_TAG." >&2
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          sha256sum "$TARBALL"
          npm publish "$TARBALL" --dry-run --ignore-scripts --access public --tag "$DIST_TAG"
      - name: Publish verified package
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        # Matches the dry run above. Publishing a tarball runs no lifecycle
        # scripts either way; the flag states that rather than relying on it.
        run: npm publish "$TARBALL" --ignore-scripts --access public --tag "$DIST_TAG"
