name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # The release policy allows only one published GitHub Release while this
  # queue has active or pending work, so GitHub cannot replace a pending run.
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      dist-tag: ${{ steps.package.outputs.dist-tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up npm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          npm install --global npm@12.0.2
          echo "${NPM_CONFIG_PREFIX}/bin" >> "$GITHUB_PATH"
          "${NPM_CONFIG_PREFIX}/bin/npm" --version
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-24-
            ${{ runner.os }}-npm-
      - name: Verify release metadata
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag ($RELEASE_TAG) must exactly match $EXPECTED_TAG." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not an ancestor of origin/main." >&2
            exit 1
          fi
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm." >&2
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            LATEST_VERSION="$(npm view "$PACKAGE_NAME" dist-tags.latest)"
            node --input-type=module - "$PACKAGE_VERSION" "$LATEST_VERSION" <<'NODE'
          const [candidate, current] = process.argv.slice(2);
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value);
            if (match === null) throw new Error(`Expected a stable semantic version, received ${value}.`);
            return match.slice(1).map(Number);
          };
          const candidateParts = parse(candidate);
          const currentParts = parse(current);
          for (let index = 0; index < candidateParts.length; index += 1) {
            if (candidateParts[index] > currentParts[index]) process.exit(0);
            if (candidateParts[index] < currentParts[index]) {
              throw new Error(`${candidate} must be newer than npm latest ${current}.`);
            }
          }
          throw new Error(`${candidate} must be newer than npm latest ${current}.`);
          NODE
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Install browser dependencies
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run release checks
        env:
          SNUI_RELEASE_APPROVED: "true"
          SNUI_SNAPSHOT_VARIANT: ubuntu24-x64
        run: npm run release:check
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-release
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Pack verified package
        run: |
          mkdir package
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("package.json", "utf8"));
          manifest.gitHead = process.env.GITHUB_SHA;
          await writeFile("package.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          TARBALL_NAME="$(npm pack --ignore-scripts --pack-destination package)"
          TARBALL="package/${TARBALL_NAME}"
          PACKED_GIT_HEAD="$(tar --extract --gzip --to-stdout --file "$TARBALL" package/package.json | node -e 'let input=""; process.stdin.on("data", chunk => { input += chunk; }); process.stdin.on("end", () => console.log(JSON.parse(input).gitHead ?? ""));')"
          if [ "$PACKED_GIT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Packed gitHead ($PACKED_GIT_HEAD) must exactly match $GITHUB_SHA." >&2
            exit 1
          fi
          sha256sum "$TARBALL"
      - name: Preserve verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Set up npm
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          npm install --global npm@12.0.2
          echo "${NPM_CONFIG_PREFIX}/bin" >> "$GITHUB_PATH"
          "${NPM_CONFIG_PREFIX}/bin/npm" --version
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package
      - name: Verify publish candidate
        id: package
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          EXPECTED_GIT_HEAD: ${{ github.sha }}
        run: |
          shopt -s nullglob
          TARBALLS=(package/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one verified tarball, found ${#TARBALLS[@]}." >&2
            exit 1
          fi
          TARBALL="$(realpath -- "${TARBALLS[0]}")"
          if [[ "$TARBALL" != /* ]]; then
            echo "Publish candidate must resolve to an absolute path, received $TARBALL." >&2
            exit 1
          fi
          PACKED_MANIFEST="$(tar --extract --gzip --to-stdout --file "$TARBALL" package/package.json)"
          PACKAGE_NAME="$(node -e 'const manifest = JSON.parse(process.argv[1]); console.log(manifest.name);' "$PACKED_MANIFEST")"
          PACKAGE_VERSION="$(node -e 'const manifest = JSON.parse(process.argv[1]); console.log(manifest.version);' "$PACKED_MANIFEST")"
          PACKED_GIT_HEAD="$(node -e 'const manifest = JSON.parse(process.argv[1]); console.log(manifest.gitHead ?? "");' "$PACKED_MANIFEST")"
          if [ "$PACKED_GIT_HEAD" != "$EXPECTED_GIT_HEAD" ]; then
            echo "Packed gitHead ($PACKED_GIT_HEAD) must exactly match $EXPECTED_GIT_HEAD." >&2
            exit 1
          fi
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm." >&2
            exit 1
          fi
          if [ "$DIST_TAG" = "latest" ]; then
            LATEST_VERSION="$(npm view "$PACKAGE_NAME" dist-tags.latest)"
            node --input-type=module - "$PACKAGE_VERSION" "$LATEST_VERSION" <<'NODE'
          const [candidate, current] = process.argv.slice(2);
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value);
            if (match === null) throw new Error(`Expected a stable semantic version, received ${value}.`);
            return match.slice(1).map(Number);
          };
          const candidateParts = parse(candidate);
          const currentParts = parse(current);
          for (let index = 0; index < candidateParts.length; index += 1) {
            if (candidateParts[index] > currentParts[index]) process.exit(0);
            if (candidateParts[index] < currentParts[index]) {
              throw new Error(`${candidate} must be newer than npm latest ${current}.`);
            }
          }
          throw new Error(`${candidate} must be newer than npm latest ${current}.`);
          NODE
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          sha256sum "$TARBALL"
          npm publish "$TARBALL" --dry-run --ignore-scripts --access public --tag "$DIST_TAG"
      - name: Publish verified package
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: npm publish "${{ steps.package.outputs.tarball }}" --access public --tag "$DIST_TAG"
